name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

#
#   Every job only checks out, builds, tests and uploads artifacts, so the token needs to read the
#   repository and nothing more.
#
permissions:
  contents: read

#
#   Third-party code runs here with the job's token and decides the test results, so nothing is
#   taken at a mutable reference: each action is pinned to the full commit SHA of its release (the
#   tag is the trailing comment), and Bun and TestMe to exact versions. Moving one is a reviewed
#   change to this file. test/guard/ci-pins.tst.sh fails the suite if any of these
#   regresses.
#
jobs:
  test:
    name: Test on ${{ matrix.os }} (${{ matrix.tls }})
    runs-on: ${{ matrix.os }}
    #
    #   A full run is a release build, a debug build and a 224-test suite that takes about four
    #   minutes on macOS. The earlier six-minute limit was cutting healthy runs off.
    #
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        tls: [openssl]
        include:
          - os: ubuntu-24.04
            install-deps: sudo apt-get update && sudo apt-get install -y gcc build-essential libc6-dev openssl libssl-dev
          #
          #   MbedTLS is the only TLS stack on ESP32, so it is built and tested here on every push. A
          #   separate leg rather than an added step: it regenerates the projects for MbedTLS.
          #
          - os: ubuntu-24.04
            tls: mbedtls
            install-deps: sudo apt-get update && sudo apt-get install -y gcc build-essential libc6-dev openssl libssl-dev cmake bzip2
          #
          #   aws/tap is pre-tapped on GitHub's macOS runners and is untrusted under Homebrew's tap-trust
          #   policy, so every brew invocation prints a nine-line warning about it. Nothing here uses it,
          #   so drop the tap rather than silencing the check. A warning nobody can act on is a warning
          #   everybody learns to scroll past, and the next one may matter.
          #
          - os: macos-latest
            install-deps: brew untap aws/tap >/dev/null 2>&1 || true; brew update && brew install openssl
          - os: windows-latest
            install-deps: echo "Windows dependencies are located by projects\\openssl-prep.bat"

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install system dependencies
        shell: bash
        run: |
          if [ -z '${{ matrix.install-deps }}' ]; then
            echo "No dependency install command configured for ${{ matrix.os }}" >&2
            exit 1
          fi
          ${{ matrix.install-deps }}

      #
      #   Ubuntu packages MbedTLS 2.28, below the 3.6.7 floor the runtime refuses to compile under, so
      #   build the release tarball, pinned by version and SHA-256: a floor bump is then an explicit,
      #   reviewed change here. Shared libraries, because the unit tests link the TLS libraries ahead
      #   of their own source (projects/gmake2/tls-linux.rsp). /usr/local is on the loader's path, so
      #   the tools and apps need no rpath. MBEDTLS_DIR points test/r/tls-floor at this install.
      #
      - name: Build MbedTLS
        if: matrix.tls == 'mbedtls'
        env:
          MBEDTLS_VERSION: 3.6.7
          MBEDTLS_SHA256: a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL -o mbedtls.tar.bz2 \
            "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-$MBEDTLS_VERSION/mbedtls-$MBEDTLS_VERSION.tar.bz2"
          echo "$MBEDTLS_SHA256  mbedtls.tar.bz2" | sha256sum -c -
          tar xjf mbedtls.tar.bz2
          cmake -S "mbedtls-$MBEDTLS_VERSION" -B mbedtls-build -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SHARED_MBEDTLS_LIBRARY=On -DENABLE_PROGRAMS=Off -DENABLE_TESTING=Off \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build mbedtls-build -j 4
          sudo cmake --install mbedtls-build
          sudo ldconfig
          echo "MBEDTLS_DIR=/usr/local" >> "$GITHUB_ENV"

      #
      #   The committed projects select OpenSSL. Regenerate the library and app makefiles for MbedTLS
      #   with the premake release they were generated by, pinned by SHA-256.
      #
      - name: Generate MbedTLS projects
        if: matrix.tls == 'mbedtls'
        env:
          PREMAKE_VERSION: 5.0.0-beta8
          PREMAKE_SHA256: 63edd3e7461eebdd45b500a3c7e8ad4e7a67d68f230010f9a97cbb71b4ec59c8
        run: |
          set -e
          curl -fsSL -o "$RUNNER_TEMP/premake.tar.gz" \
            "https://github.com/premake/premake-core/releases/download/v$PREMAKE_VERSION/premake-$PREMAKE_VERSION-linux.tar.gz"
          echo "$PREMAKE_SHA256  $RUNNER_TEMP/premake.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/premake.tar.gz" -C "$RUNNER_TEMP" premake5
          chmod +x "$RUNNER_TEMP/premake5"
          for dir in projects apps/blank/projects apps/blink/projects apps/http/projects apps/unit/projects ; do
            (cd "$dir" && "$RUNNER_TEMP/premake5" --tls=mbedtls --mbedtls-path=/usr/local gmake)
          done
          grep -q -- '-DME_COM_MBEDTLS=1' projects/gmake2/tls-linux.rsp

      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> $GITHUB_PATH
        if: runner.os != 'Windows'

      - name: Add Bun to PATH (Windows)
        run: echo "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if: runner.os == 'Windows'

      #
      #   --trust runs the package's install scripts, which TestMe needs: its postinstall builds the
      #   tm binary and installs testme.h. That is acceptable only for an exact version, never for
      #   whatever the registry serves at the time.
      #
      - name: Install TestMe
        run: |
          bun install -g --trust @embedthis/testme@0.8.37

      - name: Verify TestMe installation (Unix)
        if: runner.os != 'Windows'
        run: |
          tm --version

      - name: Verify TestMe installation (Windows)
        if: runner.os == 'Windows'
        run: |
          tm.exe --version

      #
      #   The default build is the release configuration an integrator ships, of every application,
      #   not just the one the tests drive: a template that no longer builds is a customer's first
      #   experience of the release. Optimisation enables diagnostics the debug build cannot produce,
      #   so any warning is a failure. "make test" then builds the debug configuration it needs.
      #
      - name: Build release (Unix)
        if: runner.os != 'Windows'
        run: |
          #
          #   pipefail, because the pipeline's status is tee's. Without it a release build that
          #   fails to compile reported success.
          #
          set -o pipefail
          make SHOW=1 2>&1 | tee /tmp/release-build.log
          #
          #   Match "warning:" rather than "warning": SHOW=1 echoes the compiler command lines,
          #   which carry flags such as -Wno-unknown-warning-option that a looser pattern hits.
          #
          if grep -qE 'warning:|is obsolete' /tmp/release-build.log ; then
            echo "::error::Release build produced warnings"
            grep -E 'warning:|is obsolete' /tmp/release-build.log
            exit 1
          fi

      #
      #   Build the documented way, through make.bat, and not by invoking msbuild with arguments of
      #   this workflow's own. make.bat runs everything through projects\windows.bat, which locates
      #   Visual Studio and sources openssl-prep.bat. msbuild discards the INCLUDE and LIB that
      #   openssl-prep.bat exports, which is why the projects carry the OpenSSL include path
      #   themselves; this step is where that is proven. No MSBuild setup action is needed.
      #
      - name: Build release (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          make.bat /v:normal

      - name: Run test suite (Unix)
        if: runner.os != 'Windows'
        run: |
          make test

      #
      #   Through windows.bat rather than openssl-prep.bat alone: TestMe compiles the .tst.c tests
      #   with cl.exe, so the step needs the whole VC environment and not just msbuild on PATH.
      #   windows.bat selects the x64 toolchain the solutions target whatever the host architecture
      #   is, so it and the build step above agree. The suite needs the debug configuration, which
      #   make.bat builds only when asked.
      #
      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call make.bat debug /v:minimal || exit /b 1
          call projects\windows.bat cmd /c "call bin\prep-test.bat && tm test"

      #
      #   A server that will not start is reported by the runner as an exit code and nothing else.
      #   The agent-owned groups keep the agent's log beside the group, and the vendored groups'
      #   cleanup scripts print theirs on failure; show whatever survived.
      #
      #   TestMe reports a test that failed to build as "! ERROR" with no compiler output, and
      #   writes the real message to <group>/.testme/<test>.tst/compile.log. Print every one of
      #   those that names an error, so a build failure is diagnosed from the run that produced it
      #   rather than from a second run added to fetch the message.
      #
      - name: Show test diagnostics
        if: failure()
        shell: bash
        continue-on-error: true
        run: |
          #
          #   Collect into a file, then emit it to both the step log and the job summary. A step
          #   log is one click down from a failed run and easy to miss; the summary is the first
          #   thing the run page shows.
          #
          out=diagnostics.txt
          : > "$out"
          for f in test/soak/ioto.log test/stress/ioto.log test/url/web.log test/url/web.out test/web/web.log test/web/web.out ; do
            if [ -s "$f" ] ; then echo "===== $f" >> "$out" ; tail -60 "$f" >> "$out" ; fi
          done
          echo "===== .testme directories" >> "$out"
          find test -type d -name .testme >> "$out" 2>/dev/null
          echo "===== compile logs naming an error" >> "$out"
          found=0
          for f in $(find test -name compile.log -size +0 2>/dev/null) ; do
            if grep -qiE 'error|cannot open|unresolved' "$f" ; then
              found=$((found + 1))
              echo "===== $f" >> "$out"
              cat "$f" >> "$out"
            fi
          done
          #
          #   Say so explicitly. Silence here previously read as "the diagnostics did not run".
          #
          if [ "$found" -eq 0 ] ; then
            echo "  No compile.log named an error. Total compile.log files: $(find test -name compile.log 2>/dev/null | wc -l)" >> "$out"
            echo "  A test reported as ! ERROR with no compiler error failed to LINK, not to compile." >> "$out"
          fi
          echo "===== done" >> "$out"
          cat "$out"
          { echo '## Test diagnostics'; echo '```'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      #
      #   Why the url and web groups' servers did not answer their health check. setup.sh reports a
      #   failure to stderr and exits, but TestMe prints only "Setup process exited with code 1", so
      #   run the pieces here: resolve the endpoint the way setup.sh does, start the server with full
      #   tracing, and probe it. Never fails the job - it exists to explain one that already failed.
      #
      - name: Server startup diagnostics
        if: failure()
        shell: bash
        continue-on-error: true
        run: |
          export PATH="$PWD/build/bin:$PWD/bin:$PATH"
          for group in url web ; do
            echo "===== $group"
            ( cd "test/$group" || exit 0
              echo "-- endpoint from web.json5:"
              json web.listen[0] web.json5 || echo "  json command failed"
              echo "-- starting the server for 5 seconds"
              web --config web.json5 --trace diag.log:all:all &
              pid=$!
              sleep 5
              echo "-- probe:"
              curl -s -o /dev/null -w '   status %{http_code}\n' --max-time 3 \
                  "$(json web.listen[0] web.json5)/index.html" || echo "   curl failed"
              kill "$pid" 2>/dev/null
              echo "-- trace:"
              tail -40 diag.log 2>/dev/null || echo "   no diag.log written"
            )
          done
          echo "===== done"

      #
      #   Every group keeps its build and run artifacts under its own .testme directory, so the
      #   glob must reach test/<group>/.testme and not only the one at test/.
      #
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.tls }}
          path: |
            test/**/.testme/**
            test/*/ioto.log
            test/*/web.log
            test/*/web.out
            test/*/diag.log
          retention-days: 7

  #
  #   Static analysis on every push. Ioto has no package-manager dependencies to audit: its third-party
  #   code is vendored and it links an external TLS library (OpenSSL or MbedTLS).
  #
  #   The analyzer flags assert-based API contracts and dead stores that are not defects, so a raw
  #   count is not a pass/fail signal. The step reports rather than fails, and uploads the report.
  #
  security:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc build-essential libc6-dev openssl libssl-dev clang-tools

      - name: Static analysis (scan-build)
        run: |
          scan-build -o build/scan-results --status-bugs make lib || true
          scan-build -o /dev/null make lib 2>&1 | tail -1

      - name: Upload static-analysis report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scan-build-report
          path: build/scan-results
          if-no-files-found: ignore
          retention-days: 90
